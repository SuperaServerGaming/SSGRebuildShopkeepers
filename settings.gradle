rootProject.name = 'shopkeepers'

// SSG fork: trimmed to only the module we actually deploy (Folia/Paper 26.2), since the
// legacy Spigot-only modules require CraftBukkit artifacts built locally via BuildTools that
// we have no use for and don't want to maintain. See modules/dist/build.gradle for the
// matching trim of its nmsModules list. 'test' dropped too: it depended on the removed
// v1_21_R5 module and nothing else in this project depends on 'test'.
def subprojects = [
	'external-annotations',
	'api',
	'main',
	'v26_2_R1_paper',
	'dist'
]

subprojects.each { subproject ->
	include subproject
	project(":${subproject}").projectDir = file("modules/${subproject}")
	project(":${subproject}").name = "shopkeepers-${subproject}"
}
